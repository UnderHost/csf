# CSF 2.0 - Core Shield Firewall - WHM AppConfig registration.
# Registered with: /usr/local/cpanel/bin/register_appconfig cpanelshield.conf

# Addon name (identifier used by (un)register_appconfig)
name=cpanelshield

# Service that serves this app
service=whostmgr

# Absolute URL path (docroot is /usr/local/cpanel/whostmgr/docroot, so this
# maps to docroot/cgi/cpanelshield/firewall.cgi)
url=/cgi/cpanelshield/firewall.cgi

# Run as
user=root

# Required ACLs (root / resellers-with-all). The CGI also gates via
# Whostmgr::ACLS::hasroot().
acls=all

# Menu label shown in WHM
displayname=Core Shield Firewall

# Menu icon (installed to whostmgr/docroot/addon_plugins/cpanelshield.png)
icon=cpanelshield.png

# Entry URL shown in the WHM UI - RELATIVE to cgi/ (NO leading cgi/, or WHM
# doubles it to /cgi/cgi/... and 404s).
entryurl=cpanelshield/firewall.cgi

target=_self
