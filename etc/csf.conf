# CSF 2.0 - Core Shield Firewall - starter configuration
# csf.conf-compatible: KEY = "value". Unknown legacy keys are preserved on load.
# Deploy to /etc/csf/csf.conf. Review before disabling TESTING.

CONFIG_VERSION = "2.0"

# TESTING = "1" builds and validates the ruleset but does NOT enforce (safe
# default). Set to "0" only after confirming TCP_IN/MGMT_PORTS below are correct
# and you can reach this server on SSH/WHM.
TESTING = "1"

# First-class IPv6. Leave enabled unless the host has no IPv6 stack.
IPV6 = "1"
ICMP_IN = "1"

# Base chain policy for inbound. "drop" = default-deny (classic CSF behaviour).
INPUT_POLICY = "drop"

# Log dropped inbound packets (prefix "csf-drop-in:"). Off by default to keep
# logs quiet; enable while tuning.
DROP_LOG = "0"

# Inbound service ports (both IPv4 and IPv6 - one inet table). Standard cPanel
# set; the installer refines this from live service discovery.
TCP_IN  = "20,21,22,25,53,80,110,143,443,465,587,993,995,2077,2078,2079,2080,2082,2083,2086,2087,2095,2096"
UDP_IN  = "53"

# Outbound. Empty TCP_OUT => allow all outbound (recommended for hosting).
TCP_OUT = ""
UDP_OUT = ""

# Management ports that MUST stay reachable. The lockout guard refuses an
# enforcing reload if any of these (or your live SSH port) are not in TCP_IN,
# unless your IP is explicitly allowed. The live SSH port is added automatically.
MGMT_PORTS = "22,2087,2083,2086,2082"

# Seconds a --safe-reload waits for 'csf2 --confirm' before auto-reverting.
SAFE_RELOAD_TIMEOUT = "30"

# Binary + paths
NFT     = "/usr/sbin/nft"
ETC_DIR = "/etc/csf"
VAR_DIR = "/var/lib/csf"

# Optional custom nftables snippets injected into the input/output chains.
# These survive ruleset regeneration. One rule per line, nft syntax, e.g.:
# INCLUDE_INPUT = "tcp dport 8443 accept"
INCLUDE_INPUT  = ""
INCLUDE_OUTPUT = ""

# ---------------------------------------------------------------------------
# LFD log sources. LFD tails the files in csf.logfiles. Servers without
# rsyslog (Debian 12+, some minimal images) keep SSH/mail logins only in the
# systemd journal: LF_JOURNAL = "auto" reads the journal when there is no
# /var/log/auth.log or /var/log/secure; "1" always, "0" never.
# ---------------------------------------------------------------------------
LF_JOURNAL = "auto"

# ---------------------------------------------------------------------------
# Threat Intelligence - automated reputation feeds loaded into nftables sets.
# TI_ENABLE turns the module on. Per-feed toggles: TI_<FEEDID> = "0"|"1".
# High-confidence feeds are on by default; noisier feeds are off. Feeds never
# touch csf.deny. Run 'csf --ti-update' (installer adds an hourly cron).
# ---------------------------------------------------------------------------
TI_ENABLE = "0"
TI_SPAMHAUS_DROP4 = "1"
TI_SPAMHAUS_DROP6 = "1"
TI_FEODO = "1"
TI_CINS = "1"
TI_IPSUM3 = "1"
TI_BLOCKLIST_ALL = "0"
TI_BLOCKLIST_SSH = "0"
TI_BLOCKLIST_MAIL = "0"
TI_BLOCKLIST_WEB = "0"

# ---------------------------------------------------------------------------
# Cloudflare edge allowlist - when "1", all Cloudflare IP ranges are kept on
# the allow list so proxied visitor traffic is never blocked by LFD. Toggle it
# from the WHM Firewall tab or with 'csf --cf-enable' / '--cf-disable'.
# ---------------------------------------------------------------------------
CF_ENABLE = "0"

# ---------------------------------------------------------------------------
# Standalone web UI (servers without WHM: CloudPanel, plain Linux) - v2.2.0.
# Served by csf2-ui on UI_BIND:UI_PORT, behind its own login (password + TOTP).
# Keep UI_BIND on 127.0.0.1 and publish it through a TLS reverse proxy
# (CloudPanel reverse-proxy site) or an SSH tunnel. Users: csf --ui-user add <name>
# UI_ALLOW: optional comma-separated IPs/CIDRs allowed to reach the UI (empty = any).
# UI_TRUST_PROXY: "1" = take the client IP from X-Real-IP/X-Forwarded-For when
# the request comes from the local reverse proxy.
# ---------------------------------------------------------------------------
UI_BIND = "127.0.0.1"
UI_PORT = "6789"
UI_ALLOW = ""
UI_TRUST_PROXY = "1"

# ---------------------------------------------------------------------------
# Malicious upload scanning - v2.3.0. Turn it on with: csf --scan-setup
# Every 5 minutes the website files that changed since the last run are scanned
# with ClamAV + rfxn (Linux Malware Detect) signatures, YARA (rfxn + YARA-Forge)
# and built-in heuristics. Web-malware signature hits are "certain":
#   SCAN_ACTION "quarantine" moves them to /var/lib/csf/quarantine (restore with
#   csf --quarantine restore <id>); "alert" only logs (/var/log/csf2-scan.log).
#   SCAN_BLOCK_UPLOADER "1" temp-blocks the uploader for SCAN_BLOCK_TTL seconds
#   when the FTP or web log names one unambiguous IP around the upload time.
# Heuristic-only hits are always just logged.
# Document roots are found per platform (cPanel, DirectAdmin, CloudPanel,
# /var/www); add more with SCAN_PATHS and skip some with SCAN_EXCLUDE (comma
# lists of absolute paths). SCAN_EXT: comma list of extensions, "*" = all,
# empty = php/phtml/phar/inc/js/html/ico/... SCAN_CLAMAV_OFFICIAL "1" also
# loads the full ClamAV database (much more RAM and time per scan).
# With Imunify360 installed scans are skipped unless SCAN_FORCE = "1".
# SCAN_ALERT_TO: email for detections (one message per run, certain hits only);
# empty = LF_ALERT_TO, else root; "none" = no email. Needs a working sendmail.
# ---------------------------------------------------------------------------
SCAN_ENABLE = "0"
SCAN_ACTION = "quarantine"
SCAN_BLOCK_UPLOADER = "1"
SCAN_BLOCK_TTL = "86400"
SCAN_MAX_SIZE = "5242880"
SCAN_MAX_FILES = "20000"
SCAN_PATHS = ""
SCAN_EXCLUDE = ""
SCAN_EXT = ""
SCAN_CLAMAV_OFFICIAL = "0"
SCAN_FORCE = "0"
SCAN_ALERT_TO = ""
